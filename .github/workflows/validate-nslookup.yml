name: CI nslookup Build
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches:
      - '*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci-nslookup:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9.x"]
        poetry-version: ["1.8.4"]
        os: [ubuntu-latest]
        coherenceVersion:
          - 25.03.2
          - 22.06.13
        base-image:
          - gcr.io/distroless/java17-debian11
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Maven packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Poetry
        shell: bash
        run: |
          pip install poetry==${{ matrix.poetry-version }}

      - name: Install Dependencies
        run: python -m poetry install

      - name: Configure Validation
        run: python -m poetry run make validate-setup

      - name: Validate Sources
        run: python -m poetry run make validate

      - name: Run Coherence Server
        shell: bash
        run: |
          export COHERENCE_VERSION=${{ matrix.coherenceVersion }}
          COHCTL_VERSION=1.10.9
          COHCTL_SHA256=4220326b15e1ac78c21e2e1cd5d34a79e8a6ee1b4d20a231fe9d6ef9f2b8033d
          curl -sL -o /tmp/cohctl "https://github.com/oracle/coherence-cli/releases/download/${COHCTL_VERSION}/cohctl-${COHCTL_VERSION}-linux-amd64"
          echo "${COHCTL_SHA256}  /tmp/cohctl" | sha256sum -c -
          chmod u+x /tmp/cohctl
          sudo mv /tmp/cohctl /usr/local/bin/cohctl
          cohctl version
          cohctl create cluster grpc-cluster -v ${{ matrix.coherenceVersion }} -y -a coherence-grpc-proxy
          sleep 20
          cohctl monitor health -n localhost:7574 -T 40 -w

      - name: Run test
        shell: bash
        run: |
          export COHERENCE_SERVER_ADDRESS=coherence:///localhost:7574
          python -m poetry run make test-nslookup

      - name: Archive server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-${{matrix.python-version}}-${{ matrix.coherenceVersion }}
          path: ./tests/utils/*.txt
          retention-days: 10
