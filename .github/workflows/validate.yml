name: CI Build
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches:
      - '*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9.x", "3.10.x", "3.11.x", "3.12.x", "3.13.x"]
        poetry-version: ["1.8.4"]
        os: [ubuntu-latest]
        coherenceVersion:
          - 25.03.2
          - 22.06.13
        base-image:
          - gcr.io/distroless/java17-debian11
        profile:
          - ",-jakarta,javax"
          - ",jakarta,-javax"
        exclude:
          - coherenceVersion: 25.03.2
            profile: ",-jakarta,javax"
          - coherenceVersion: 22.06.13
            profile: ",jakarta,-javax"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Get Docker Images
        shell: bash
        run: |
          docker pull ${{ matrix.base-image }}
          uname -a

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Maven packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Poetry
        shell: bash
        run: |
          pip install poetry==${{ matrix.poetry-version }}

      - name: Install Dependencies
        run: python -m poetry install

      - name: Configure Validation
        run: python -m poetry run make validate-setup

      - name: Validate Sources
        run: python -m poetry run make validate

      - name: Run test
        shell: bash
        run: |
          python -m poetry run ./tests/scripts/run-tests.sh \
                  ${{ matrix.coherenceVersion }} \
                  ${{ matrix.base-image }} \
                  ${{ matrix.profile }}
      - name: Archive server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-${{matrix.python-version}}-${{ matrix.coherenceVersion }}
          path: ./tests/utils/*.txt
          retention-days: 10
